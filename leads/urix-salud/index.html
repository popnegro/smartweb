<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Reservá tu turno — Urix Salud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f5fbf7', 100: '#e6f5f0', 200: '#c1e8de', 300: '#9cdccb', 400: '#72cbb5', 500: '#4db5a1', 600: '#3d9687', 700: '#2d7a6f', 800: '#1f5f59', 900: '#164b48', 950: '#0a2d2a' },
            ink: '#0a2d2a',
          },
          fontFamily: {
            sans: ['"Segoe UI"', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: { card: '0 1px 2px rgba(10,45,42,0.06), 0 1px 8px rgba(10,45,42,0.06)' },
          borderRadius: { xl2: '1rem' },
        }
      }
    }
  </script>
  <style>
    :root {
      --primary: #2d7a6f;
      --primary-light: #4db5a1;
      --bg: #f5fbf7;
    }

    html,
    body {
      background: var(--bg);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .fade-in {
      animation: fadeIn .35s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pop {
      animation: pop .28s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes pop {
      from {
        transform: scale(.9);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .card-select {
      transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
    }

    .card-select:hover {
      transform: translateY(-2px);
    }

    .slot-btn {
      transition: all .15s ease;
    }

    input[type=checkbox] {
      accent-color: var(--primary);
    }

    .skeleton {
      background: linear-gradient(90deg, #f5fbf7 25%, #e6f5f0 37%, #f5fbf7 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0 50%
      }
    }
  </style>
</head>

<body class="font-sans text-ink antialiased">

  <div id="app"></div>

  <script>
    /* =========================================================
       DATA MOCK — SALUD INTEGRAL
    ========================================================= */
    const PROFESSIONALS = [
      { id: 'np', name: 'Lic. Natalia Pereyra', specialty: 'Nutrición y dietética clínica', initials: 'NP', color: 'bg-primary-100 text-primary-800', tone: 'mañana', gcalConnected: true, gcalEmail: 'natalia.pereyra@urquisalud.com', gcalLastSync: null },
      { id: 'cf', name: 'Prof. Carlos Ferreyra', specialty: 'Actividad física y entrenamiento', initials: 'CF', color: 'bg-emerald-100 text-emerald-800', tone: 'tarde', gcalConnected: true, gcalEmail: 'carlos.ferreyra@urquisalud.com', gcalLastSync: null },
      { id: 'sg', name: 'Lic. Sofía González', specialty: 'Kinesiología y fisioterapia', initials: 'SG', color: 'bg-blue-100 text-blue-800', tone: 'mixto', gcalConnected: true, gcalEmail: 'sofia.gonzalez@urquisalud.com', gcalLastSync: null },
      { id: 'rd', name: 'Dr. Roberto Díaz', specialty: 'Gastroenterología', initials: 'RD', color: 'bg-orange-100 text-orange-800', tone: 'mañana', gcalConnected: false, gcalEmail: 'roberto.diaz@urquisalud.com', gcalLastSync: null },
      { id: 'mc', name: 'Coach Marta Chávez', specialty: 'Coaching ontológico y bienestar', initials: 'MC', color: 'bg-purple-100 text-purple-800', tone: 'tarde', gcalConnected: true, gcalEmail: 'marta.chavez@urquisalud.com', gcalLastSync: null },
    ];

    const MOTIVOS = [
      { value: 'eval_nutri', label: 'Evaluación nutricional / Dieta personalizada' },
      { value: 'plan_ejercicio', label: 'Plan de ejercicios / Entrenamiento personalizado' },
      { value: 'rehab_lesion', label: 'Rehabilitación de lesión / Dolor crónico' },
      { value: 'consulta_gastro', label: 'Consulta gastroenterológica' },
      { value: 'coaching_vida', label: 'Sesión de coaching de vida / Bienestar' },
      { value: 'antropometria', label: 'Medición antropométrica / Composición corporal' },
      { value: 'otro', label: 'Otro / Consulta general' },
    ];

    const OBRAS_SOCIALES = [
      'OSDE', 'Swiss Medical', 'Galeno', 'Sancor Salud', 'Medifé', 'IOMA',
      'Accord Salud', 'Federada Salud', 'Particular / Reintegro',
    ];

    const DAY_NAMES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    function buildDays(n = 7) {
      const days = [];
      const today = new Date();
      let d = new Date(today);
      while (days.length < n) {
        if (d.getDay() !== 0) {
          days.push(new Date(d));
        }
        d.setDate(d.getDate() + 1);
      }
      return days;
    }
    const DAYS = buildDays(7);

    function slotsForTone(tone) {
      if (tone === 'mañana') return ['09:00', '09:45', '10:30', '11:15', '12:00'];
      if (tone === 'tarde') return ['14:00', '14:45', '15:30', '16:15', '17:00'];
      return ['09:30', '11:00', '14:30', '16:00', '17:30'];
    }

    function genAvailability() {
      const avail = {};
      PROFESSIONALS.forEach(p => {
        avail[p.id] = {};
        DAYS.forEach((day, di) => {
          const key = dateKey(day);
          const slots = slotsForTone(p.tone).map((time, ti) => {
            const occupied = ((di * 7 + ti * 3 + p.id.charCodeAt(0)) % 5) === 0;
            return { time, occupied };
          });
          avail[p.id][key] = slots;
        });
      });
      return avail;
    }
    function dateKey(d) { return d.toISOString().slice(0, 10); }
    function fmtDay(d) { return `${DAY_NAMES[d.getDay()]} ${d.getDate()}`; }
    function fmtFull(d) { return `${DAY_NAMES[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`; }

    /* =========================================================
       STATE + PERSISTENCE
    ========================================================= */
    const STORAGE_KEY = 'urqui_salud_turnos_v1';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { }
      return { bookings: [] };
    }
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ bookings: store.bookings }));
    }

    const store = Object.assign({
      route: 'booking',
      step: 1,
      selectedProf: null,
      selectedDate: null,
      selectedTime: null,
      patient: { nombre: '', telefono: '', motivo: '', obraSocial: 'no', obraSocialNombre: '', obraSocialOtra: '', numeroSocio: '', tipoConsulta: 'primera_vez', comentario: '' },
      card: { numero: '', vencimiento: '', cvv: '', nombre: '' },
      processing: false,
      showSuccess: false,
      lastBooking: null,
      errors: {},
      loginError: '',
      dashTab: PROFESSIONALS[0].id,
      role: null,
    }, loadState());

    store.availability = genAvailability();
    function applyBookingsToAvailability() {
      store.bookings.forEach(b => {
        const day = store.availability[b.profId] && store.availability[b.profId][b.dateKey];
        if (day) {
          const slot = day.find(s => s.time === b.time);
          if (slot) slot.occupied = true;
        }
      });
    }
    applyBookingsToAvailability();

    function setState(patch) {
      Object.assign(store, patch);
      render();
    }

    /* =========================================================
       ICONS
    ========================================================= */
    const Icon = {
      lock: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
      star: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01z"/></svg>`,
      check: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><polyline points="20 6 9 17 4 12"/></svg>`,
      chevronRight: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><polyline points="9 18 15 12 9 6"/></svg>`,
      chevronLeft: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><polyline points="15 18 9 12 15 6"/></svg>`,
      calendar: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
      clock: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>`,
      whatsapp: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M12.02 2C6.5 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.06-1.33A10 10 0 0 0 12.02 22C17.55 22 22 17.52 22 12S17.55 2 12.02 2zm5.87 14.2c-.25.7-1.24 1.29-2.03 1.46-.55.11-1.26.2-3.65-.78-3.06-1.27-5.03-4.36-5.19-4.56-.15-.2-1.23-1.64-1.23-3.13 0-1.49.78-2.22 1.06-2.52.28-.3.6-.37.8-.37.2 0 .4 0 .58.01.19.01.44-.07.68.52.25.6.85 2.08.92 2.23.07.15.12.33.02.53-.1.2-.15.33-.3.5-.15.18-.32.4-.45.53-.15.15-.31.31-.13.61.18.3.8 1.32 1.72 2.14 1.18 1.05 2.17 1.38 2.47 1.53.3.15.48.13.65-.08.18-.2.75-.87.95-1.17.2-.3.4-.25.66-.15.27.1 1.73.82 2.02.97.3.15.5.22.57.35.07.13.07.75-.18 1.45z"/></svg>`,
      dashboard: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>`,
      arrowLeft: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
      gcal: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-4 h-4"><rect x="3" y="4" width="18" height="17" rx="2" fill="#fff" stroke="#8f9296" stroke-width="1"/><rect x="3" y="4" width="18" height="4.2" rx="0" fill="#1a73e8"/><rect x="3" y="4" width="18" height="4.2" rx="2" fill="#1a73e8"/><rect x="6.5" y="11" width="4" height="4" fill="#34a853"/><rect x="13.5" y="11" width="4" height="4" fill="#fbbc04"/><rect x="6.5" y="16.2" width="4" height="2.3" fill="#4285f4"/></svg>`,
      syncCheck: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>`,
      syncOff: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>`,
    };

    /* =========================================================
       SHARED UI COMPONENTS
    ========================================================= */
    function Badge(text, tone = 'primary') {
      const tones = {
        primary: 'bg-primary-100 text-primary-800',
        warn: 'bg-amber-100 text-amber-800',
        neutral: 'bg-slate-100 text-slate-700',
        success: 'bg-emerald-100 text-emerald-800',
      };
      return `<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-medium ${tones[tone]}">${text}</span>`;
    }

    function Stepper(current) {
      const steps = ['Profesional', 'Horario', 'Tus datos', 'Pago'];
      return `
  <div class="sticky top-0 z-30 bg-[var(--bg)]/90 backdrop-blur border-b border-primary-100">
    <div class="max-w-2xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-primary-700 uppercase tracking-wide">Paso ${current} de 4</span>
        <span class="text-xs text-slate-500">${steps[current - 1]}</span>
      </div>
      <div class="flex gap-1.5">
        ${steps.map((s, i) => `<div class="h-1.5 flex-1 rounded-full ${i < current ? 'bg-primary-600' : 'bg-primary-100'} transition-colors duration-300"></div>`).join('')}
      </div>
    </div>
  </div>`;
    }

    function Header() {
      return `
  <div class="max-w-2xl mx-auto px-4 pt-6 pb-2 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-primary-700 flex items-center justify-center text-white font-bold text-sm">U</div>
      <div>
        <span class="font-semibold text-ink block">Urix Salud</span>
        <span class="text-[10px] text-slate-500 leading-none">Centro de salud integral</span>
      </div>
    </div>
    <button data-action="go-dashboard-login" class="text-xs text-slate-500 hover:text-primary-700 flex items-center gap-1">${Icon.dashboard}<span class="hidden sm:inline">Panel</span></button>
  </div>`;
    }

    /* =========================================================
       STEP 1 — ELEGIR PROFESIONAL
    ========================================================= */
    function StepProfesional() {
      const cards = PROFESSIONALS.map(p => {
        const selected = store.selectedProf === p.id;
        return `
    <button data-action="select-prof" data-id="${p.id}"
      class="card-select w-full text-left rounded-xl2 border-2 ${selected ? 'border-primary-600 bg-primary-50 shadow-card' : 'border-slate-200 bg-white hover:border-primary-300'} p-4 flex items-center gap-4">
      <div class="w-12 h-12 shrink-0 rounded-full ${p.color} flex items-center justify-center font-semibold">${p.initials}</div>
      <div class="flex-1 min-w-0">
        <p class="font-medium text-ink truncate">${p.name}</p>
        <p class="text-sm text-slate-500 truncate">${p.specialty}</p>
      </div>
      <div class="w-6 h-6 rounded-full ${selected ? 'bg-primary-600 text-white' : 'bg-slate-100 text-transparent'} flex items-center justify-center shrink-0 transition-colors">${Icon.check}</div>
    </button>`;
      }).join('');

      return `
  <div class="fade-in max-w-2xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold text-ink mb-1">Tu bienestar es nuestro propósito</h1>
    <p class="text-slate-500 mb-6">Elegí profesional, horario y confirmá tu turno. Sin trámites, sin esperas.</p>
    <div class="space-y-3">${cards}</div>
  </div>
  <div class="h-24"></div>
  ${FooterCTA('Ver horarios disponibles', 'next-from-1', !store.selectedProf)}
  `;
    }

    /* =========================================================
       STEP 2 — ELEGIR HORARIO
    ========================================================= */
    function StepHorario() {
      const prof = PROFESSIONALS.find(p => p.id === store.selectedProf);
      if (!store.selectedDate) store.selectedDate = dateKey(DAYS[0]);

      const dayTabs = DAYS.map(d => {
        const key = dateKey(d);
        const active = store.selectedDate === key;
        return `<button data-action="select-date" data-key="${key}" class="slot-btn shrink-0 flex flex-col items-center justify-center rounded-lg px-3 py-2 min-w-[56px] border ${active ? 'bg-primary-700 border-primary-700 text-white' : 'bg-white border-slate-200 text-slate-600 hover:border-primary-300'}">
      <span class="text-[10px] uppercase tracking-wide ${active ? 'text-primary-100' : 'text-slate-400'}">${DAY_NAMES[d.getDay()]}</span>
      <span class="text-base font-semibold">${d.getDate()}</span>
    </button>`;
      }).join('');

      const daySlots = store.availability[prof.id][store.selectedDate] || [];
      const availableCount = daySlots.filter(s => !s.occupied).length;

      const slotButtons = daySlots.map(s => {
        const selected = store.selectedTime === s.time && !s.occupied;
        if (s.occupied) {
          return `<button disabled class="slot-btn rounded-lg border border-slate-100 bg-slate-50 text-slate-300 py-3 text-sm font-medium cursor-not-allowed line-through">${s.time}</button>`;
        }
        return `<button data-action="select-time" data-time="${s.time}" class="slot-btn rounded-lg border py-3 text-sm font-medium ${selected ? 'border-primary-600 bg-primary-600 text-white shadow-card' : 'border-primary-200 bg-white text-ink hover:border-primary-500 hover:bg-primary-50'}">${s.time}</button>`;
      }).join('');

      return `
  <div class="fade-in max-w-2xl mx-auto px-4 py-6">
    <button data-action="back-step" class="text-sm text-slate-500 hover:text-primary-700 flex items-center gap-1 mb-4">${Icon.arrowLeft} Volver</button>
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-full ${prof.color} flex items-center justify-center font-semibold text-sm">${prof.initials}</div>
      <div>
        <p class="font-medium text-ink">${prof.name}</p>
        <p class="text-xs text-slate-500">${prof.specialty}</p>
      </div>
    </div>

    ${availableCount <= 2 ? `<div class="mb-4">${Badge(`${Icon.clock} Pocos horarios disponibles esta semana`.replace(Icon.clock, ''), 'warn')}</div>` : ''}

    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-4">${dayTabs}</div>

    <p class="text-sm font-medium text-ink mb-2 flex items-center gap-1">${Icon.calendar} ${fmtFull(new Date(store.selectedDate))}</p>

    ${daySlots.length ? `<div class="grid grid-cols-3 gap-2">${slotButtons}</div>` : `<p class="text-sm text-slate-400 py-8 text-center">Sin horarios este día.</p>`}
  </div>
  <div class="h-24"></div>
  ${FooterCTA('Continuar con mis datos', 'next-from-2', !store.selectedTime)}
  `;
    }

    /* =========================================================
       STEP 3 — DATOS DEL PACIENTE
    ========================================================= */
    function fieldError(name) {
      return store.errors[name] ? `<p class="text-xs text-rose-600 mt-1">${store.errors[name]}</p>` : '';
    }
    function inputClass(name) {
      return `w-full rounded-lg border ${store.errors[name] ? 'border-rose-400 focus:ring-rose-300' : 'border-slate-200 focus:ring-primary-300 focus:border-primary-500'} px-3 py-2.5 text-[16px] outline-none focus:ring-2 transition-colors bg-white`;
    }

    function StepDatos() {
      const p = store.patient;
      return `
  <div class="fade-in max-w-2xl mx-auto px-4 py-6">
    <button data-action="back-step" class="text-sm text-slate-500 hover:text-primary-700 flex items-center gap-1 mb-4">${Icon.arrowLeft} Volver</button>
    <h2 class="text-xl font-bold text-ink mb-1">Información personal</h2>
    <p class="text-slate-500 text-sm mb-6">Necesitamos estos datos para preparar tu sesión.</p>

    <form id="patient-form" class="space-y-4" novalidate>
      <div>
        <label class="text-sm font-medium text-ink block mb-1">Nombre completo</label>
        <input name="nombre" type="text" value="${escapeAttr(p.nombre)}" placeholder="Ej: María García" class="${inputClass('nombre')}" />
        ${fieldError('nombre')}
      </div>
      <div>
        <label class="text-sm font-medium text-ink block mb-1">Teléfono / WhatsApp</label>
        <input name="telefono" type="tel" value="${escapeAttr(p.telefono)}" placeholder="Ej: 11 2345 6789" class="${inputClass('telefono')}" />
        ${fieldError('telefono')}
      </div>
      <div>
        <label class="text-sm font-medium text-ink block mb-1">Motivo de consulta</label>
        <select name="motivo" class="${inputClass('motivo')}">
          <option value="" ${!p.motivo ? 'selected' : ''} disabled>Elegí un motivo</option>
          ${MOTIVOS.map(m => `<option value="${m.value}" ${p.motivo === m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
        </select>
        ${fieldError('motivo')}
      </div>

      <div class="pt-2 border-t border-slate-100">
        <p class="text-sm font-medium text-ink mb-2">¿Es tu primera vez?</p>
        <div class="flex gap-2">
          <button type="button" data-action="set-tipo" data-value="primera_vez" class="flex-1 rounded-lg border py-2 text-sm ${p.tipoConsulta === 'primera_vez' ? 'border-primary-600 bg-primary-50 text-primary-800 font-medium' : 'border-slate-200 text-slate-600'}">Primera vez</button>
          <button type="button" data-action="set-tipo" data-value="seguimiento" class="flex-1 rounded-lg border py-2 text-sm ${p.tipoConsulta === 'seguimiento' ? 'border-primary-600 bg-primary-50 text-primary-800 font-medium' : 'border-slate-200 text-slate-600'}">Seguimiento</button>
        </div>
      </div>

      <div>
        <p class="text-sm font-medium text-ink mb-2">¿Tenés cobertura médica?</p>
        <div class="flex gap-2 mb-2">

    function drawMockQr(canvas, text) {
      const ctx = canvas.getContext('2d');
      const size = 21;
      const cell = canvas.width / size;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0a2d2a';
      let seed = 0;
      for (let i = 0; i < text.length; i++) seed = (seed * 31 + text.charCodeAt(i)) >>> 0;
      function rnd() { seed = (seed * 1103515245 + 12345) >>> 0; return (seed >>> 16) / 65535; }
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const isFinder = (x < 7 && y < 7) || (x > size - 8 && y < 7) || (x < 7 && y > size - 8);
          if (isFinder) continue;
          if (rnd() > 0.55) ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
      [[0, 0], [size - 7, 0], [0, size - 7]].forEach(([fx, fy]) => {
        ctx.fillStyle = '#0a2d2a';
        ctx.fillRect(fx * cell, fy * cell, 7 * cell, 7 * cell);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect((fx + 1) * cell, (fy + 1) * cell, 5 * cell, 5 * cell);
        ctx.fillStyle = '#0a2d2a';
        ctx.fillRect((fx + 2) * cell, (fy + 2) * cell, 3 * cell, 3 * cell);
      });
    }

    <div class="rounded-xl2 border border-dashed border-slate-200 bg-slate-50 p-6 text-center">
      <p class="text-sm text-slate-500">Acceso a historial de sesiones solo para SúperAdmin.</p>
    </div>`}
  </div>`;
    }

    /* =========================================================
       HELPERS
    ========================================================= */
    function escapeAttr(s) { return (s || '').toString().replace(/"/g, '&quot;'); }

    function validatePatient() {
      const p = store.patient;
      const errors = {};
      if (!p.nombre || p.nombre.trim().length < 3) errors.nombre = 'Ingresá tu nombre completo.';
      if (!p.telefono || p.telefono.replace(/\D/g, '').length < 8) errors.telefono = 'Ingresá un teléfono válido.';
      if (!p.motivo) errors.motivo = 'Elegí un tipo de sesión.';
      if (p.obraSocial === 'si') {
        if (!p.obraSocialNombre) errors.obraSocialNombre = 'Elegí tu cobertura médica.';
        if (!p.numeroSocio || p.numeroSocio.trim().length < 4) errors.numeroSocio = 'Ingresá tu número de afiliado.';
      }
      return errors;
    }

    /* =========================================================
       EVENT DELEGATION
    ========================================================= */
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'go-dashboard-login') { setState({ route: 'dashboard-login', loginError: '' }); return; }
      if (action === 'back-to-booking') { setState({ route: 'booking' }); return; }
      if (action === 'logout') { setState({ route: 'booking', role: null }); return; }

      if (action === 'select-prof') { setState({ selectedProf: el.dataset.id, selectedTime: null }); return; }
      if (action === 'next-from-1') { if (store.selectedProf) setState({ step: 2 }); return; }

      if (action === 'select-date') { setState({ selectedDate: el.dataset.key, selectedTime: null }); return; }
      if (action === 'select-time') { setState({ selectedTime: el.dataset.time }); return; }
      if (action === 'next-from-2') { if (store.selectedTime) setState({ step: 3 }); return; }

      if (action === 'set-tipo') { store.patient.tipoConsulta = el.dataset.value; render(); return; }
      if (action === 'set-os') {
        store.patient.obraSocial = el.dataset.value;
        if (el.dataset.value === 'no') {
          store.patient.obraSocialNombre = '';
          store.patient.obraSocialOtra = '';
          store.patient.numeroSocio = '';
        }
        render();
        return;
      }
      if (action === 'next-from-3') {
        syncPatientForm();
        const errors = validatePatient();
        if (Object.keys(errors).length) { setState({ errors }); return; }
        setState({ step: 4, errors: {} });
        return;
      }

      if (action === 'back-step') { setState({ step: Math.max(1, store.step - 1), errors: {} }); return; }

      if (action === 'submit-payment') {
        setState({ processing: true, errors: {} });
        setTimeout(() => {
          const prof = PROFESSIONALS.find(p => p.id === store.selectedProf);
          const booking = {
            id: 'b_' + Date.now(),
            profId: store.selectedProf,
            dateKey: store.selectedDate,
            time: store.selectedTime,
            patient: { ...store.patient },
            status: 'pagado',
            gcalSynced: !!prof.gcalConnected,
          };
          store.bookings.push(booking);
          const day = store.availability[booking.profId][booking.dateKey];
          const slot = day.find(s => s.time === booking.time);
          if (slot) slot.occupied = true;
          if (prof.gcalConnected) prof.gcalLastSync = new Date().toISOString();
          saveState();
          setState({ processing: false, showSuccess: true, lastBooking: booking });
        }, 1100);
        return;
      }

      if (action === 'toggle-gcal') {
        const p = PROFESSIONALS.find(x => x.id === el.dataset.id);
        if (p) {
          p.gcalConnected = !p.gcalConnected;
          if (p.gcalConnected) p.gcalLastSync = new Date().toISOString();
          render();
        }
        return;
      }

      if (action === 'close-success') { setState({ showSuccess: false, route: 'summary' }); return; }

      if (action === 'new-booking') {
        setState({
          route: 'booking', step: 1, selectedProf: null, selectedDate: null, selectedTime: null,
          patient: { nombre: '', telefono: '', motivo: '', obraSocial: 'no', obraSocialNombre: '', obraSocialOtra: '', numeroSocio: '', tipoConsulta: 'primera_vez', comentario: '' },
          card: { numero: '', vencimiento: '', cvv: '', nombre: '' }, errors: {}, lastBooking: null,
        });
        return;
      }

      if (action === 'submit-login') { e.preventDefault(); doLogin(); return; }
      if (action === 'dash-tab') { setState({ dashTab: el.dataset.id }); return; }
      if (action === 'cancel-booking') {
        const b = store.bookings.find(x => x.id === el.dataset.id);
        if (b) {
          b.status = 'cancelado';
          const day = store.availability[b.profId][b.dateKey];
          const slot = day.find(s => s.time === b.time);
          if (slot) slot.occupied = false;
          saveState();
          render();
        }
        return;
      }
    });

    document.addEventListener('submit', (e) => {
      if (e.target.id === 'login-form') { e.preventDefault(); doLogin(); }
    });

    function doLogin() {
      const form = document.getElementById('login-form');
      const usuario = form.querySelector('[name=usuario]').value.trim();
      const password = form.querySelector('[name=password]').value.trim();
      if (usuario === 'admin' && password === 'salud2026') {
        setState({ route: 'dashboard', role: 'superadmin', loginError: '' });
      } else if (usuario === 'editor' && password === 'salud2026') {
        setState({ route: 'dashboard', role: 'editor', loginError: '' });
      } else {
        setState({ loginError: 'Usuario o contraseña incorrectos. Probá con admin / salud2026' });
      }
    }

    function syncPatientForm() {
      const form = document.getElementById('patient-form');
      if (!form) return;
      store.patient.nombre = form.querySelector('[name=nombre]').value;
      store.patient.telefono = form.querySelector('[name=telefono]').value;
      store.patient.motivo = form.querySelector('[name=motivo]').value;
      const osSelect = form.querySelector('[name=obraSocialNombre]');
      if (osSelect) store.patient.obraSocialNombre = osSelect.value;
      const numSocio = form.querySelector('[name=numeroSocio]');
      if (numSocio) store.patient.numeroSocio = numSocio.value;
      store.patient.comentario = form.querySelector('[name=comentario]').value;
    }

    /* =========================================================
       RENDER ROOT
    ========================================================= */
    function render() {
      const app = document.getElementById('app');
      let html = '';

      if (store.route === 'dashboard-login') {
        html = DashboardLogin();
      } else if (store.route === 'dashboard') {
        html = Dashboard();
      } else if (store.route === 'summary') {
        html = Header() + Summary();
      } else {
        let stepHtml = '';
        if (store.step === 1) stepHtml = StepProfesional();
        else if (store.step === 2) stepHtml = StepHorario();
        else if (store.step === 3) stepHtml = StepDatos();
        else if (store.step === 4) stepHtml = StepPago();
        html = Stepper(store.step) + Header() + stepHtml;
      }

      html += SuccessDialog();
      app.innerHTML = html;

      if (store.route === 'booking' && store.step === 4) {
        const canvas = document.getElementById('mp-qr');
        if (canvas) drawMockQr(canvas, buildMpLink());
      }
    }

    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.name === 'motivo') { store.patient.motivo = t.value; store.errors.motivo = null; }
      if (t.name === 'obraSocialNombre') {
        syncPatientForm();
        store.patient.obraSocialNombre = t.value;
        store.errors.obraSocialNombre = null;
        render();
      }
    });

    render();
  </script>
</body>

</html>
